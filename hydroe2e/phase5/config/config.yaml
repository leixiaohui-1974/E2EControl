# =============================================================================
# E2EControl 统一配置文件
# South-to-North Water Diversion Middle Route - AI Control System
# =============================================================================
# 版本: 1.0.0
# 说明: 本文件整合所有AI模型和系统参数，支持环境覆盖
# =============================================================================

# -----------------------------------------------------------------------------
# 系统全局配置
# -----------------------------------------------------------------------------
system:
  name: "E2EControl"
  version: "5.0.0"
  environment: "development"  # development, testing, production
  log_level: "INFO"
  random_seed: 42
  device: "auto"  # auto, cpu, cuda, cuda:0

# -----------------------------------------------------------------------------
# 南水北调中线物理系统参数
# -----------------------------------------------------------------------------
water_system:
  # 全线基本参数
  total_length: 1432.0        # km - 中线总长度
  num_pools: 63               # 渠池数量
  num_gates: 64               # 闸门数量
  avg_velocity: 1.5           # m/s - 平均流速

  # 默认渠池参数
  default_pool:
    area: 100000.0            # m² - 默认渠池面积
    length: 22.73             # km - 平均渠段长度
    width: 30.0               # m - 平均渠道宽度
    initial_level: 4.0        # m - 初始水位
    target_level: 4.0         # m - 目标水位
    min_level: 1.5            # m - 最低安全水位
    max_level: 5.5            # m - 最高安全水位
    tau: 14400.0              # s - 时间常数(4h)

  # 默认闸门参数
  default_gate:
    max_opening: 1.0          # 最大开度(归一化)
    min_opening: 0.0          # 最小开度
    max_flow: 300.0           # m³/s - 最大过闸流量
    max_change_rate: 0.1      # 开度变化率限制/step

  # 边界条件
  boundary:
    base_inflow: 200.0        # m³/s - 基础入流
    base_demand: 180.0        # m³/s - 基础需求
    inflow_noise_std: 5.0     # m³/s - 入流噪声标准差
    demand_noise_std: 3.0     # m³/s - 需求噪声标准差

# -----------------------------------------------------------------------------
# 时间参数
# -----------------------------------------------------------------------------
timing:
  dt: 900.0                   # s - 控制时间步长(15分钟)
  episode_duration: 86400.0   # s - 单episode时长(24小时)
  history_length: 96          # steps - 历史观测窗口(24小时)
  prediction_horizon: 48      # steps - 预测时域(12小时)
  observation_window: 16      # steps - 观测窗口(4小时)

  # 延迟参数
  min_delay: 1800.0           # s - 最小水流传播延迟(30分钟)
  max_delay: 86400.0          # s - 最大水流传播延迟(24小时)

# -----------------------------------------------------------------------------
# 强化学习环境配置 (water_canal_env)
# -----------------------------------------------------------------------------
environment:
  # 观测空间
  observation:
    window: 16                # 历史步数
    features: 5               # 特征数量: [level, inflow, outflow, gate, demand]

  # 动作空间
  action:
    type: "continuous"        # continuous, discrete
    dim: 1                    # 单闸控制
    low: -0.1                 # 最小动作(开度变化)
    high: 0.1                 # 最大动作

  # 奖励函数权重
  reward:
    level_weight: 1.0         # 水位偏差权重
    action_weight: 0.1        # 动作平滑权重
    safety_weight: 10.0       # 安全违规惩罚权重
    efficiency_weight: 0.05   # 效率奖励权重

  # 目标水位
  target:
    upstream: 4.0             # m - 上游目标水位
    downstream: 3.8           # m - 下游目标水位
    tolerance: 0.1            # m - 允许偏差

# -----------------------------------------------------------------------------
# 神经物理引擎配置 (neural_physics_engine)
# -----------------------------------------------------------------------------
neural_physics:
  # 网络结构
  architecture:
    type: "lstm"              # lstm, gru
    input_dim: 5              # 输入维度
    hidden_dim: 128           # 隐藏层维度
    num_layers: 2             # 层数
    output_dim: 1             # 输出维度
    dropout: 0.1              # Dropout率
    sequence_length: 16       # 序列长度

  # 物理约束损失
  physics_loss:
    enabled: true
    weight: 0.1               # PINN损失权重
    max_change: 0.5           # m - 最大水位变化/步
    mass_balance_weight: 1.0  # 质量守恒权重

  # 训练参数
  training:
    learning_rate: 0.001
    batch_size: 64
    num_epochs: 100
    early_stopping_patience: 10
    gradient_clip: 1.0

# -----------------------------------------------------------------------------
# 深度场景编码器配置 (deep_scenario_encoder)
# -----------------------------------------------------------------------------
scenario_encoder:
  # 编码器架构
  architecture:
    type: "cnn"               # cnn, transformer
    input_channels: 5         # 输入通道数
    sequence_length: 96       # 输入序列长度
    hidden_dim: 128           # 隐藏维度
    embedding_dim: 64         # 嵌入维度
    num_layers: 3             # 层数

  # Transformer专用参数
  transformer:
    num_heads: 4              # 注意力头数
    ff_dim: 256               # 前馈网络维度
    dropout: 0.1

  # 对比学习
  contrastive:
    temperature: 0.1          # InfoNCE温度
    similarity_threshold: 0.7 # 相似度阈值

  # 向量数据库
  vector_db:
    index_type: "flat"        # flat, ivf, hnsw
    metric: "cosine"          # cosine, euclidean
    nlist: 100                # IVF聚类数
    nprobe: 10                # IVF搜索数

# -----------------------------------------------------------------------------
# 场景VAE配置 (scenario_vae)
# -----------------------------------------------------------------------------
scenario_vae:
  # 网络结构
  architecture:
    sequence_length: 96
    num_channels: 4           # level, flow, demand, gate
    encoder_hidden_dim: 128
    latent_dim: 32
    decoder_hidden_dim: 128

  # 训练参数
  training:
    learning_rate: 0.001
    kl_weight: 0.001          # KL散度权重
    temperature: 1.0          # 采样温度
    batch_size: 32
    num_epochs: 200

  # 数据标准化参数
  normalization:
    flow_scale: 100.0         # 流量缩放因子
    flow_offset: 200.0        # 流量偏移
    level_scale: 2.0          # 水位缩放因子
    level_offset: 3.0         # 水位偏移
    roughness_scale: 0.003    # 糙率缩放因子
    roughness_offset: 0.015   # 糙率偏移

# -----------------------------------------------------------------------------
# 数据生成器配置 (data_generator)
# -----------------------------------------------------------------------------
data_generator:
  # 数据量
  num_samples: 100000
  sequence_length: 16

  # 场景比例分布
  scenario_ratios:
    steady: 0.2               # 稳态
    step: 0.2                 # 阶跃
    random: 0.3               # 随机
    periodic: 0.2             # 周期
    extreme: 0.1              # 极端

  # 参数范围
  ranges:
    inflow: [50.0, 400.0]     # m³/s
    level: [1.0, 6.0]         # m
    gate: [0.1, 1.0]          # 开度
    demand: [100.0, 300.0]    # m³/s

# -----------------------------------------------------------------------------
# E2E自主控制器配置 (e2e_controller)
# -----------------------------------------------------------------------------
autonomous_controller:
  # 网络架构
  architecture:
    state_dim: 128            # 状态表示维度
    action_dim: 64            # 动作表示维度
    hidden_dim: 256           # 隐藏层维度
    num_attention_heads: 8    # 注意力头数

  # 位置编码
  position_encoding:
    spatial_scale: 0.02       # 空间位置缩放
    temporal_scale: 0.02      # 时间位置缩放

  # 自主等级
  autonomy:
    level: "L4_HIGH"          # L0-L5
    confidence_threshold: 0.3 # 自主决策置信度阈值
    human_override: true      # 允许人工干预

  # 损失权重
  loss_weights:
    level: 1.0                # 水位损失权重
    safety: 10.0              # 安全损失权重
    smoothness: 0.1           # 平滑损失权重
    efficiency: 0.05          # 效率损失权重

# -----------------------------------------------------------------------------
# 全线世界模型配置 (full_line_world_model)
# -----------------------------------------------------------------------------
world_model:
  # 图神经网络
  architecture:
    node_dim: 64              # 节点特征维度
    edge_dim: 32              # 边特征维度
    hidden_dim: 256           # 隐藏维度
    num_gnn_layers: 4         # GNN层数
    aggregation: "mean"       # mean, max, sum

  # 预测时域
  prediction_horizons: [4, 12, 48]  # 1h, 3h, 12h

  # 不确定性估计
  uncertainty:
    enabled: true
    num_samples: 10           # MC采样数
    dropout: 0.1              # MC Dropout率

# -----------------------------------------------------------------------------
# 持续学习配置 (continual_learner)
# -----------------------------------------------------------------------------
continual_learning:
  # 经验回放
  replay_buffer:
    capacity: 100000
    prioritized: true
    alpha: 0.6                # 优先级指数
    beta: 0.4                 # 重要性采样指数

  # 学习参数
  learning:
    algorithm: "adam"
    learning_rate: 0.0001
    batch_size: 64
    gamma: 0.99               # 折扣因子
    tau: 0.005                # 软更新率
    update_frequency: 100     # 更新频率

  # EWC正则化
  ewc:
    enabled: true
    lambda: 1000.0            # 正则化强度
    fisher_samples: 1000      # Fisher信息采样数

# -----------------------------------------------------------------------------
# 训练通用配置
# -----------------------------------------------------------------------------
training:
  # 优化器
  optimizer:
    type: "adamw"
    learning_rate: 0.001
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8

  # 学习率调度
  scheduler:
    type: "cosine"            # step, cosine, warmup_cosine
    warmup_steps: 1000
    min_lr: 1.0e-6

  # 梯度处理
  gradient:
    clip_norm: 1.0
    accumulation_steps: 1

  # 检查点
  checkpoint:
    save_interval: 1000       # steps
    max_to_keep: 5
    save_best_only: false

# -----------------------------------------------------------------------------
# 日志和监控
# -----------------------------------------------------------------------------
logging:
  # 控制台日志
  console:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 文件日志
  file:
    enabled: true
    path: "logs/e2econtrol.log"
    level: "DEBUG"
    max_bytes: 10485760       # 10MB
    backup_count: 5

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "runs/"
    flush_secs: 30

# -----------------------------------------------------------------------------
# Web仪表盘配置
# -----------------------------------------------------------------------------
dashboard:
  host: "0.0.0.0"
  port: 8080
  refresh_interval: 5         # s
  enable_control: true
  authentication:
    enabled: false
    username: "admin"
    password_hash: ""

# -----------------------------------------------------------------------------
# 数据接口配置
# -----------------------------------------------------------------------------
data_interface:
  # OPC-UA
  opcua:
    enabled: false
    server_url: "opc.tcp://localhost:4840"
    namespace: "ns=2"
    security_mode: "None"
    timeout: 5000             # ms

  # Modbus
  modbus:
    enabled: false
    host: "localhost"
    port: 502
    unit_id: 1
    timeout: 3000             # ms

  # 数据回放
  replay:
    enabled: false
    data_path: "data/historical/"
    speed_factor: 1.0

# -----------------------------------------------------------------------------
# 模型路径
# -----------------------------------------------------------------------------
paths:
  models: "models/"
  data: "data/"
  logs: "logs/"
  checkpoints: "checkpoints/"
  scenarios: "hil_testing/scenarios/"
