[project]
name = "e2econtrol"
version = "1.0.0"
description = "End-to-End Intelligent Water Network Control System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "E2EControl Team"},
]
keywords = ["water-network", "mpc", "digital-twin", "anomaly-detection", "self-healing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "cvxpy>=1.1.0",
    "networkx>=2.5",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "pandas>=1.3.0",
    "scikit-learn>=0.24.0",
    "pyyaml>=5.0",
    "h5py>=3.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
full = [
    "e2econtrol[deep-learning,dev]",
    "stable-baselines3>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.10.0",
]

[tool.pytest.ini_options]
testpaths = [
    ".",
    "tests",
    "phase2/tests",
    "phase4/tests",
    "phase5/tests",
    "phase5/distributed_sil/tests",
    "phase5/water_transfer_system/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
norecursedirs = [
    "phase5/ai_models",
    "__pycache__",
    ".git",
    "docker",
    "web",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
