[project]
name = "hydroe2e"
version = "1.1.0"
description = "HydroE2E - End-to-End Intelligent Water Network Control System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Lei Xiaohui", email = "leixiaohui@iwhr.com"},
]
keywords = ["water-network", "mpc", "digital-twin", "anomaly-detection", "self-healing", "hydromind"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "cvxpy>=1.3",
    "networkx>=3.0",
    "flask>=2.3",
    "flask-cors>=4.0",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "h5py>=3.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
hydromind = ["hydromind-contracts>=0.1.0"]
deep-learning = [
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
full = [
    "hydroe2e[hydromind,deep-learning,dev]",
    "stable-baselines3>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.10.0",
]

[project.scripts]
hydroe2e-api = "hydroe2e.api:run_app"

[project.entry-points."hydromind.roles"]
e2e_controller = "hydroe2e.role:E2ERoleModule"

[project.entry-points."hydromind.engines"]
hydroe2e = "hydroe2e.mcp_servers.e2e_server"

[tool.setuptools.packages.find]
include = ["hydroe2e*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "hydroe2e/phase2/tests",
    "hydroe2e/phase4/tests",
    "hydroe2e/phase5/tests",
    "hydroe2e/phase5/distributed_sil/tests",
    "hydroe2e/phase5/water_transfer_system/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
norecursedirs = [
    "hydroe2e/phase5/ai_models",
    "__pycache__",
    ".git",
    "docker",
    "web",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
