# S4 - 冰期场景
# 测试系统应对低温结冰和冰塞的能力

scenarios:
  - id: S4_ICE_001
    name: 糙率变化
    description: 冰盖形成导致水力糙率增加
    category: S4_ICE
    difficulty: 2
    autonomous_level: L2
    duration: 3600.0

    initial_state:
      water_levels:
        pool_1: 2.0
      gate_positions:
        gate_1: 0.5
      inflows:
        inflow_1: 10.0

    conditions:
      - id: C030
        name: 糙率增加
        description: 曼宁糙率系数增加30%
        injection:
          target: roughness
          type: ramp
          start_time: 60.0
          end_time: 1860.0
          magnitude: 0.3
          parameters:
            base_value: 0.025
            rate: 0.00017  # 每秒增加

    pass_criteria:
      safety:
        max_level_deviation: 0.3
      control:
        settling_time: 600.0

  - id: S4_ICE_002
    name: 闸门冻结
    description: 低温导致闸门响应变慢
    category: S4_ICE
    difficulty: 3
    autonomous_level: L3
    duration: 3600.0

    initial_state:
      water_levels:
        pool_1: 2.0
      gate_positions:
        gate_1: 0.5
      inflows:
        inflow_1: 10.0

    conditions:
      - id: C031
        name: 闸门响应迟滞
        description: 闸门动作速度降低50%
        injection:
          target: gate_1
          type: stuck
          start_time: 300.0
          parameters:
            speed_reduction: 0.5
            response_delay: 10.0

    pass_criteria:
      safety:
        max_level_deviation: 0.4
      control:
        robustness: 0.7

  - id: S4_ICE_003
    name: 冰塞形成
    description: 局部冰塞导致水位异常上涨
    category: S4_ICE
    difficulty: 4
    autonomous_level: L3
    duration: 7200.0

    initial_state:
      water_levels:
        pool_1: 2.0
      gate_positions:
        gate_1: 0.5
      inflows:
        inflow_1: 10.0

    conditions:
      - id: C032
        name: 冰塞阻塞
        description: 出流断面减小40%
        injection:
          target: outflow_1
          type: step
          start_time: 600.0
          magnitude: -4.0  # 出流减少40%

    pass_criteria:
      safety:
        no_overflow: true
        max_level_deviation: 0.5
      intelligence:
        anomaly_detection: 0.8

  - id: S4_ICE_004
    name: 冰塞突发溃决
    description: 冰塞突然溃决导致流量骤增
    category: S4_ICE
    difficulty: 5
    autonomous_level: L4
    duration: 3600.0

    initial_state:
      water_levels:
        pool_1: 2.5  # 因冰塞导致水位偏高
      gate_positions:
        gate_1: 0.7
      inflows:
        inflow_1: 10.0

    conditions:
      - id: C033
        name: 冰塞溃决
        description: 冰塞突然溃决，上游积水涌入
        injection:
          target: inflow_1
          type: pulse
          start_time: 600.0
          end_time: 900.0
          magnitude: 25.0  # 短时流量激增

    pass_criteria:
      safety:
        no_overflow: true
        emergency_response: true
      intelligence:
        rapid_adaptation: 0.8
        autonomous_decision: 0.75

  - id: S4_ICE_005
    name: 传感器冻结
    description: 传感器因低温工作异常
    category: S4_ICE
    difficulty: 4
    autonomous_level: L3
    duration: 7200.0

    initial_state:
      water_levels:
        pool_1: 2.0
      gate_positions:
        gate_1: 0.5
      inflows:
        inflow_1: 10.0

    conditions:
      - id: C034
        name: 传感器冻结
        description: 水位传感器读数卡死
        injection:
          target: sensor_level_1
          type: stuck
          start_time: 600.0
          end_time: 3600.0
          magnitude: 2.0  # 卡死在2.0m
          parameters:
            stuck_value: 2.0

    pass_criteria:
      safety:
        no_overflow: true
        no_dry_out: true
      intelligence:
        sensor_fault_detection: 0.9
        state_estimation: 0.8

  # S4.06 冰期流速控制
  - id: S4_ICE_006
    name: 冰期流速控制
    description: 控制流速防止冰盖破坏
    category: S4_ICE
    difficulty: 4
    autonomous_level: L3
    duration: 7200.0

    initial_state:
      water_levels:
        pool_1: 2.0
      gate_positions:
        gate_1: 0.5
      inflows:
        inflow_1: 10.0
      ice_cover:
        thickness: 0.3  # 冰盖厚度30cm
        status: stable

    conditions:
      - id: C035
        name: 流速控制
        description: 下游需求增加但需控制流速
        injection:
          target: outflow_demand
          type: step
          start_time: 600.0
          magnitude: 5.0
          parameters:
            max_velocity: 0.8  # m/s
            ice_protection: true

    pass_criteria:
      safety:
        max_velocity: 0.8
        ice_cover_intact: true
      control:
        demand_satisfaction: 0.8
        velocity_control: 0.9

  # S4.07 水温异常
  - id: S4_ICE_007
    name: 水温异常
    description: 异常低温导致的运行调整
    category: S4_ICE
    difficulty: 3
    autonomous_level: L2
    duration: 14400.0

    initial_state:
      water_levels:
        pool_1: 2.0
      gate_positions:
        gate_1: 0.5
      inflows:
        inflow_1: 10.0
      temperature: 2.0  # 接近冰点

    conditions:
      - id: C036
        name: 极端低温
        description: 水温降至0°C附近
        injection:
          target: temperature
          type: ramp
          start_time: 0.0
          end_time: 7200.0
          magnitude: -2.0  # 温度从2°C降到0°C

    pass_criteria:
      safety:
        no_pipe_freeze: true
        operational_continuity: true
      intelligence:
        temperature_monitoring: 0.85
        preventive_measures: 0.8

  # S4.08 综合冰期管理
  - id: S4_ICE_008
    name: 综合冰期管理
    description: 多因素复合的冰期运行管理
    category: S4_ICE
    difficulty: 5
    autonomous_level: L4
    duration: 86400.0  # 24小时

    initial_state:
      water_levels:
        pool_1: 2.2
        pool_2: 2.0
        pool_3: 1.8
      gate_positions:
        gate_1: 0.5
        gate_2: 0.5
        gate_3: 0.5
      inflows:
        inflow_1: 12.0
      temperature: 1.0
      ice_cover:
        pool_1: 0.2
        pool_2: 0.25
        pool_3: 0.3

    conditions:
      - id: C037_A
        name: 糙率变化
        injection:
          target: roughness
          type: ramp
          start_time: 0.0
          end_time: 43200.0
          magnitude: 0.4
      - id: C037_B
        name: 局部冰塞
        injection:
          target: outflow_2
          type: step
          start_time: 21600.0
          magnitude: -3.0

    pass_criteria:
      safety:
        all_pools_safe: true
        no_ice_damage: true
      intelligence:
        multi_factor_management: 0.8
        predictive_control: 0.75
